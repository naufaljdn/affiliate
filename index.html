<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rekomendasi Produk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c;
    --card:#161617;
    --text:#f5f5f5;
    --muted:#9a9a9a;
    --tag-bg:#232324;
    --star:#f5c542;
    --btn:#12b76a;
    --btn-text:#ffffff;
  }
  [data-theme="light"]{
  --bg:#f5f5f5;
  --card:#ffffff;
  --text:#111111;
  --muted:#666666;
  --tag-bg:#eeeeee;
}

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Poppins', -apple-system, sans-serif;
    display:flex;
    justify-content:center;
    padding:20px 12px 60px;
  }

  .page{
    width:100%;
    max-width:480px;
  }

  header{
    text-align:center;
    padding:56px 0 24px;
  }
  header h1{
    font-size:20px;
    font-weight:800;
  }
  header p{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
  }
  
  .search-box{
  width:100%;
  padding:14px 16px;
  border-radius:14px;
  border:1px solid #2a2a2c;
  background:var(--card);
  color:var(--text);
  font-size:15px;
  margin-bottom:18px;
  outline:none;
}
.search-box::placeholder{ color:var(--muted); }
.no-result{
  text-align:center;
  color:var(--muted);
  padding:30px 0;
  font-size:14px;
}
.theme-toggle{
  position:fixed;
  top:16px;
  right:16px;
  background:var(--card);
  border:1px solid #2a2a2c;
  color:var(--text);
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
  z-index:10;
}

  .products{
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  .card{
    background:var(--card);
    border-radius:18px;
    overflow:hidden;
    border:1px solid #232324;
  }

  .card img{
    width:100%;
    display:block;
    background:#fff;
    object-fit:cover;
  }

  .card-body{
    padding:18px 18px 22px;
  }

  .tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--tag-bg);
    color:var(--text);
    font-size:12px;
    padding:6px 12px;
    border-radius:20px;
    margin-bottom:14px;
  }

  .title{
    font-size:22px;
    font-weight:800;
    line-height:1.25;
    margin-bottom:10px;
  }

  .rating{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    color:var(--text);
    margin-bottom:14px;
  }
  .rating .star{ color:var(--star); }
  .rating .count{ color:var(--muted); }

  .price{
    font-size:28px;
    font-weight:800;
    margin-bottom:14px;
  }

  .quote{
    border-left:3px solid #3a3a3c;
    padding-left:14px;
    font-style:italic;
    color:var(--muted);
    font-size:14.5px;
    line-height:1.5;
    margin-bottom:20px;
  }

  .buy-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--btn);
    color:var(--btn-text);
    text-decoration:none;
    font-weight:700;
    font-size:16px;
    padding:16px;
    border-radius:14px;
  }
  .buy-btn:active{ opacity:0.85; }

  footer{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    margin-top:30px;
  }
</style>
</head>
<body>

<button class="theme-toggle" id="theme-toggle">🌙</button>

<div class="page">

  <!-- ===== GANTI: judul halaman kamu ===== -->
  <header>
    <h1>Rekomendasi Gear Favoritku</h1>
    <p>Sudah aku coba & pakai sendiri ✅</p>
  </header>

  <input type="text" class="search-box" id="search-input" placeholder="🔍 Cari produk...">
<div class="products" id="product-list"></div>

  <footer>The products above are high-quality products at the most affordable prices in 2026.</footer>
</div>

<script>
  // ======================================================
  // EDIT DI SINI SAJA: tambah/hapus/ubah produk kamu
  // ======================================================
  const products = [
    {
      tag: "🎯 Competitive Gaming",
      image: "https://naufaljdn.github.io/affiliate/produk1.jpg",
      title: "Ajazz AK820 Monochrome V2 75% Mechanical Keyboard",
      rating: "4.9",
      reviewCount: "4.2k reviews",
      price: "Rp 360.000",
      quote: "Dengan 5-Layer Dampening System memberikan typing feel yang senyap, empuk & stabil, ideal untuk gaming malam hari maupun kerja fokus. Desain elegant dengan Layout 75% + Volume Knob, build quality juga solid parah buat harga segini.",
      buttonText: "Buy on Shopee",
      link: "https://id.shp.ee/ohtsDuNr"
    },
    {
      tag: "🎯 Competitive Gaming",
      image: "https://naufaljdn.github.io/affiliate/produk2.jpg",
      title: "Fantech THOR X9 Gaming Mouse Macro",
      rating: "4.9",
      reviewCount: "2.8k reviews",
      price: "Rp 130.000",
      quote: "Fantech X9 Thor yang dipersenjatai dengan sensor generasi ketiga dari Fantech. Sensor 4800DPI yang telah disempurnakan untuk mendukung kecepatan tangan gamers dengan akselerasi 15g. kemampuan untuk mengolah 6000 frame per detik dan kemampuan jelajah hingga 60 inch per detik untuk membantu gamer yang memakai layar monitor besar.",
      buttonText: "Buy on Shopee",
      link: "https://id.shp.ee/gg7192EB"
    },
    {
      tag: "🎯 Competitive Gaming",
      image: "https://naufaljdn.github.io/affiliate/produk3.jpg",
      title: "dbE GM190 7.1 Virtual Surround Gaming Headphone",
      rating: "4.9",
      reviewCount: "4.7k reviews",
      price: "Rp 226.000",
      quote: "Dipakai beberapa jam buat main masih tetap nyaman. Dilengkapi dengan fitur Virtual Surround karakter suaranya cukup detail, jadi langkah kaki dan arah suara lawan lebih gampang didengar. Mic-nya juga jernih buat komunikasi di Discord atau in-game. Menurutku, di kelas harga segini, kualitasnya sudah sangat worth it.",
      buttonText: "Buy on Shopee",
      link: "https://id.shp.ee/kJX5B9Ja"
    },
    {
      tag: "🔥 Best Seller",
      image: "https://placehold.co/600x500/ffffff/111111?text=Foto+Produk",
      title: "Nama Produk Kamu Di Sini",
      rating: "4.9",
      reviewCount: "850 reviews",
      price: "Rp 129.000",
      quote: "Tulis testimoni singkat atau alasan kenapa produk ini direkomendasikan.",
      buttonText: "Buy on Shopee",
      link: "https://shopee.co.id/ganti-dengan-link-affiliate-2"
    }
  ];

  const list = document.getElementById("product-list");
const searchInput = document.getElementById("search-input");

function renderProducts(items) {
  list.innerHTML = "";
  if (items.length === 0) {
    list.innerHTML = `<div class="no-result">Produk tidak ditemukan 😔</div>`;
    return;
  }
  items.forEach((p) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${p.image}" alt="${p.title}">
      <div class="card-body">
        <span class="tag">${p.tag}</span>
        <div class="title">${p.title}</div>
        <div class="rating">
          <span class="star">★</span>
          <span>${p.rating}</span>
          <span class="count">(${p.reviewCount})</span>
        </div>
        <div class="price">${p.price}</div>
        <div class="quote">"${p.quote}"</div>
        <a class="buy-btn" href="${p.link}" target="_blank" rel="noopener noreferrer sponsored">${p.buttonText}</a>
      </div>
    `;
    list.appendChild(card);
  });
}

renderProducts(products);

searchInput.addEventListener("input", () => {
  const keyword = searchInput.value.toLowerCase();
  const filtered = products.filter(p =>
    p.title.toLowerCase().includes(keyword) ||
    p.tag.toLowerCase().includes(keyword)
  );
  renderProducts(filtered);
});
const themeBtn = document.getElementById("theme-toggle");
const savedTheme = localStorage.getItem("theme") || "dark";
document.documentElement.setAttribute("data-theme", savedTheme);
themeBtn.textContent = savedTheme === "light" ? "☀️" : "🌙";

themeBtn.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme");
  const next = current === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  themeBtn.textContent = next === "light" ? "☀️" : "🌙";
});
</script>

</body>
</html>
