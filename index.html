<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEARLOG.ID — Katalog Review Produk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     GEARLOG — katalog produk review
     Cara edit produk: scroll ke bawah ke bagian "const PRODUCTS"
     di dalam tag <script>. Tambah / ubah data di situ.
     ============================================================ */

  :root{
    --bg: #0B0D12;
    --surface: #14161D;
    --surface-2: #1B1E27;
    --border: #262932;
    --text: #F2F3F6;
    --text-muted: #9497A3;
    --accent-1: #8B7CFC;
    --accent-2: #4FD1E8;
    --accent-grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    --shopee: #FF5722;
    --shopee-hover: #E64A19;
    --tokopedia: #03AC0E;
    --tokopedia-hover: #039009;
    --star: #F5B942;
    --shadow: 0 12px 30px rgba(0,0,0,.35);
    --radius: 18px;
  }

  [data-theme="light"]{
    --bg: #F6F6F9;
    --surface: #FFFFFF;
    --surface-2: #F1F1F6;
    --border: #E6E6ED;
    --text: #191A22;
    --text-muted: #6E7080;
    --shadow: 0 12px 30px rgba(25,26,34,.08);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }

  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    transition: background .25s ease, color .25s ease;
    min-height:100vh;
    padding-bottom:80px;
    -webkit-font-smoothing:antialiased;
  }

  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--accent-1); color:#fff; }

  h1,h2,.brand,.card-name,.card-price,.chip,.buy-btn{
    font-family:'Sora', sans-serif;
  }

  /* ---------- Top bar / header ---------- */
  .topbar{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(11,13,18,.72);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border-bottom:1px solid var(--border);
  }
  [data-theme="light"] .topbar{ background:rgba(246,246,249,.78); }

  .topbar-inner{
    max-width:1180px;
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
    gap:22px;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:11px;
    font-weight:700;
    font-size:20px;
    letter-spacing:.2px;
    white-space:nowrap;
  }
  .logo-mark{
    width:34px; height:34px;
    border-radius:9px;
    background:var(--accent-grad);
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora', sans-serif;
    font-size:13px;
    color:#0B0D12;
    font-weight:800;
    flex-shrink:0;
  }
  .logo span.sub{
    font-family:'Inter';
    font-weight:500;
    font-size:11px;
    color:var(--text-muted);
    letter-spacing:.2px;
    display:block;
    margin-top:-1px;
  }

  .search-wrap{
    flex:1;
    position:relative;
    max-width:520px;
  }
  .search-wrap svg{
    position:absolute;
    left:14px; top:50%;
    transform:translateY(-50%);
    width:17px; height:17px;
    color:var(--text-muted);
    pointer-events:none;
  }
  #searchInput{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    padding:11px 14px 11px 40px;
    border-radius:11px;
    font-size:14.5px;
    font-family:'Inter';
    outline:none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #searchInput::placeholder{ color:var(--text-muted); }
  #searchInput:focus{
    border-color:var(--accent-1);
    box-shadow:0 0 0 3px rgba(139,124,252,.16);
  }

  .theme-toggle{
    width:42px; height:42px;
    border-radius:11px;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition: border-color .15s ease, transform .1s ease;
  }
  .theme-toggle:hover{ border-color:var(--accent-1); }
  .theme-toggle:active{ transform:scale(.93); }
  .theme-toggle svg{ width:19px; height:19px; }
  .theme-toggle .sun{ display:none; color:var(--star); }
  .theme-toggle .moon{ display:block; color:var(--accent-2); }
  [data-theme="light"] .theme-toggle .sun{ display:block; }
  [data-theme="light"] .theme-toggle .moon{ display:none; }

  /* ---------- Category chips ---------- */
  .categories{
    max-width:1180px;
    margin:0 auto;
    padding:18px 24px 12px;
    display:flex;
    gap:10px;
    flex-wrap:nowrap;
    overflow-x:auto;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    -ms-overflow-style:none;
    mask-image:linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
    -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
  }
  .categories::-webkit-scrollbar{ display:none; }
  .chip{
    font-weight:600;
    font-size:14px;
    letter-spacing:.1px;
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text-muted);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    transition: all .15s ease;
    user-select:none;
    white-space:nowrap;
    flex:0 0 auto;
  }
  .chip:hover{ color:var(--text); border-color:var(--accent-1); }
  .chip.active{
    background:var(--accent-grad);
    color:#0B0D12;
    border-color:transparent;
    box-shadow:0 4px 14px rgba(139,124,252,.32);
  }

  /* ---------- Section heading / result count ---------- */
  .section-head{
    max-width:1180px;
    margin:26px auto 16px;
    padding:0 24px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .section-head h1{
    font-size:21px;
    font-weight:700;
    letter-spacing:.1px;
  }
  #resultCount{
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    color:var(--text-muted);
  }

  /* ---------- Grid ---------- */
  .grid{
    max-width:1180px;
    margin:0 auto;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
    gap:20px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover{
    transform:translateY(-4px);
    box-shadow:var(--shadow);
    border-color:var(--accent-1);
  }

  .card-img{
    aspect-ratio:1/1;
    width:100%;
    background:var(--surface-2);
    overflow:hidden;
  }
  .card-img img{
    width:100%; height:100%;
    object-fit:cover;
    display:block;
  }

  .card-body{
    padding:18px 18px 20px;
    display:flex;
    flex-direction:column;
    gap:11px;
    flex:1;
  }

  .card-cat{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text-muted);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:11.5px;
    letter-spacing:.2px;
    padding:5px 11px;
    border-radius:999px;
    width:fit-content;
  }

  .card-name{
    font-weight:700;
    font-size:17px;
    line-height:1.3;
    letter-spacing:.1px;
  }

  .rating-row{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
  }
  .rating-row .star-icon{ color:var(--star); font-size:14px; }
  .rating-row b{ font-weight:700; color:var(--text); }
  .rating-row .muted{ color:var(--text-muted); }

  .card-price{
    font-weight:700;
    font-size:19px;
    font-variant-numeric:tabular-nums;
  }

  .card-quote{
    font-family:'Inter', sans-serif;
    font-style:italic;
    font-weight:400;
    font-size:13px;
    line-height:1.55;
    color:var(--text-muted);
    border-left:2px solid var(--accent-1);
    padding-left:11px;
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .buy-btn{
    margin-top:auto;
    width:100%;
    text-align:center;
    padding:12px 8px;
    border-radius:11px;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:.1px;
    color:#fff;
    transition: filter .15s ease, transform .1s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
  }
  .buy-btn:hover{ filter:brightness(1.08); }
  .buy-btn:active{ transform:scale(.97); }
  .buy-btn.shopee{ background:var(--shopee); }
  .buy-btn.shopee:hover{ background:var(--shopee-hover); }
  .buy-btn.tokopedia{ background:var(--tokopedia); }
  .buy-btn.tokopedia:hover{ background:var(--tokopedia-hover); }
  .buy-btn.disabled{
    background:var(--surface-2);
    color:var(--text-muted);
    cursor:default;
    pointer-events:none;
    border:1px solid var(--border);
  }

  .empty-state{
    max-width:1180px;
    margin:60px auto;
    padding:0 24px;
    text-align:center;
    color:var(--text-muted);
    font-family:'Sora', sans-serif;
    font-size:18px;
    font-weight:600;
  }

  /* ---------- About section ---------- */
  .about{
    max-width:1180px;
    margin:22px auto 0;
    padding:0 24px;
  }
  .about-inner{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:22px 24px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    position:relative;
    overflow:hidden;
  }
  .about-inner::before{
    content:"";
    position:absolute;
    inset:0;
    background:var(--accent-grad);
    opacity:.06;
    pointer-events:none;
  }
  .about-avatar{
    width:64px; height:64px;
    border-radius:50%;
    background:var(--accent-grad);
    display:flex; align-items:center; justify-content:center;
    font-family:'Sora', sans-serif;
    font-weight:800;
    font-size:22px;
    color:#0B0D12;
    flex-shrink:0;
    overflow:hidden;
  }
  .about-avatar img{
    width:100%; height:100%;
    object-fit:cover;
  }
  .about-text{ flex:1; min-width:220px; }
  .about-name{
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:17px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .about-tagline{
    font-size:12.5px;
    color:var(--text-muted);
    margin-top:2px;
  }
  .about-bio{
    font-size:13.5px;
    line-height:1.6;
    color:var(--text-muted);
    margin-top:10px;
    max-width:640px;
  }
  .about-socials{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:12px;
  }
  .about-socials a{
    font-size:12.5px;
    font-weight:600;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    transition: border-color .15s ease, transform .1s ease;
  }
  .about-socials a:hover{ border-color:var(--accent-1); transform:translateY(-1px); }

  /* ---------- Skeleton loading ---------- */
  .skeleton-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .skeleton-shimmer{
    position:relative;
    overflow:hidden;
    background:var(--surface-2);
  }
  .skeleton-shimmer::after{
    content:"";
    position:absolute;
    inset:0;
    transform:translateX(-100%);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.06), transparent);
    animation: shimmer 1.4s infinite;
  }
  [data-theme="light"] .skeleton-shimmer::after{
    background:linear-gradient(90deg, transparent, rgba(0,0,0,.05), transparent);
  }
  @keyframes shimmer{
    100%{ transform:translateX(100%); }
  }
  .skeleton-img{ aspect-ratio:1/1; width:100%; }
  .skeleton-body{ padding:18px; display:flex; flex-direction:column; gap:10px; }
  .skeleton-line{ height:12px; border-radius:6px; }
  .skeleton-line.w-70{ width:70%; }
  .skeleton-line.w-40{ width:40%; }
  .skeleton-line.w-100{ width:100%; }
  .skeleton-btn{ height:40px; border-radius:11px; margin-top:8px; }

  /* image fade-in once loaded */
  .card-img img{ opacity:0; transition:opacity .35s ease; }
  .card-img img.loaded{ opacity:1; }

  /* ---------- Detail modal ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(6,7,11,.6);
    backdrop-filter:blur(4px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .modal-overlay.open{ opacity:1; pointer-events:auto; }
  .modal-box{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    max-width:640px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    transform:translateY(16px) scale(.98);
    transition:transform .2s ease;
  }
  .modal-overlay.open .modal-box{ transform:translateY(0) scale(1); }
  .modal-img{
    width:100%;
    aspect-ratio:16/10;
    background:var(--surface-2);
    overflow:hidden;
  }
  .modal-img img{ width:100%; height:100%; object-fit:cover; display:block; }
  .modal-body{ padding:24px; display:flex; flex-direction:column; gap:12px; position:relative; }
  .modal-close{
    position:absolute;
    top:-46px; right:0;
    width:36px; height:36px;
    border-radius:50%;
    background:rgba(20,22,29,.7);
    border:1px solid var(--border);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:18px;
    line-height:1;
  }
  .modal-name{ font-family:'Sora', sans-serif; font-weight:700; font-size:21px; line-height:1.3; }
  .modal-price{ font-family:'Sora', sans-serif; font-weight:700; font-size:24px; }
  .modal-review{
    font-size:14px;
    line-height:1.7;
    color:var(--text-muted);
    border-left:2px solid var(--accent-1);
    padding-left:13px;
    font-style:italic;
  }
  .modal-buy{ margin-top:6px; }

  @media (max-width:640px){
    .about-inner{ padding:18px; }
    .modal-close{ top:10px; right:10px; background:rgba(6,7,11,.55); }
  }

  footer{
    text-align:center;
    color:var(--text-muted);
    font-size:12px;
    margin-top:50px;
    font-family:'Inter', sans-serif;
  }

  /* ---------- Accessibility ---------- */
  a:focus-visible, button:focus-visible, input:focus-visible{
    outline:2px solid var(--accent-2);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  @media (max-width:640px){
    .topbar-inner{ flex-wrap:wrap; }
    .logo{ order:1; }
    .theme-toggle{ order:2; margin-left:auto; }
    .search-wrap{ order:3; max-width:100%; flex-basis:100%; }
  }
</style>
</head>
<body data-theme="dark">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo">
        <div class="logo-mark">GG</div>
        <div>
          GEARLOG.ID
          <span class="sub">katalog review produk by naufaljdn</span>
        </div>
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Cari produk yang pernah direview...">
      </div>

      <button class="theme-toggle" id="themeToggle" aria-label="Ganti mode tampilan">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>

  </header>

  <div class="about" id="aboutSection"></div>

  <div class="categories" id="categoryBar"></div>

  <div class="section-head">
    <h1 id="sectionTitle">Semua Produk</h1>
    <span id="resultCount"></span>
  </div>

  <div class="grid" id="productGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">Produk tidak ditemukan. Coba kata kunci atau kategori lain.</div>

  <footer>GEARLOG.ID — dibuat untuk katalog review produk</footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalName">
      <button class="modal-close" id="modalClose" aria-label="Tutup">✕</button>
      <div class="modal-img">
        <img id="modalImg" src="" alt="">
      </div>
      <div class="modal-body">
        <span class="card-cat" id="modalCat"></span>
        <div class="modal-name" id="modalName"></div>
        <div class="rating-row" id="modalRating"></div>
        <div class="modal-price" id="modalPrice"></div>
        <div class="modal-review" id="modalReview"></div>
        <div id="modalBuy" class="modal-buy"></div>
      </div>
    </div>
  </div>

<script>
  /* ============================================================
     DATA PRODUK
     ------------------------------------------------------------
     Edit / tambah produk di array PRODUCTS di bawah ini.
     Field yang bisa diisi per produk:

     - name           : nama produk (string)
     - image          : URL foto produk (string). Ganti dengan
                         link foto asli produk kamu.
     - category       : salah satu dari:
                         "gaming"      -> Gaming Essential
                         "electronic"  -> Electronic
                         "accessories" -> Accessories
                         "sport"       -> Sport
                         "hiking"      -> Hiking
     - rating         : angka 0 - 5, boleh desimal (contoh 4.7)
     - reviews        : PENTING — HARUS ANGKA MURNI, TANPA HURUF.
                         Contoh benar : 4200, 1500, 52800
                         Contoh SALAH : 4.2RB, 1.5rb, "4.2K"
                         (kalau diisi huruf, seluruh website akan
                         error total dan produk tidak muncul sama
                         sekali — kayak yang kejadian kemarin).
                         Tenang, tampilannya tetap otomatis disingkat
                         jadi "4.2RB" dst di layar, kamu cukup isi
                         angka penuhnya di sini.
     - price          : harga produk, string, contoh "Rp 360.000".
                         Kosongkan "" kalau tidak mau tampilkan harga.
     - review         : review singkat kamu tentang produk ini
                         (1-2 kalimat, akan tampil miring/italic).
     - platform       : toko tempat kamu naruh link beli.
                         isi "shopee" atau "tokopedia" saja
                         (cuma 1 tombol yang akan muncul).
     - buyUrl         : link produk di toko yang dipilih di atas.
     ============================================================ */

  /* ============================================================
     TENTANG GUA
     ------------------------------------------------------------
     Edit info di bawah ini buat tampil di section "Tentang Gua".
     - initials  : 2 huruf buat avatar bulat (contoh "NJ")
     - name      : nama / nama panggung kamu
     - tagline   : deskripsi singkat (1 baris)
     - bio       : deskripsi lebih panjang (1-3 kalimat)
     - socials   : daftar link sosial media, boleh nambah/kurang.
                   label bebas, url isi link asli kamu.
     ============================================================ */
  const ABOUT_ME = {
    initials: "NJ",
    avatarImage: "https://naufaljdn.github.io/affiliate/profil.jpg", // isi link foto kamu di sini, contoh: "https://naufaljdn.github.io/affiliate/profil.jpg"
                      // kalau dikosongin "", yang muncul cuma inisial di atas
    name: "Naufal.jdn",
    tagline: "Streamer & Affiliate — gaming, elektronik, hiking",
    bio: "Produk di katalog ini sudah gua pakai dan review sendiri sebelum direkomendasikan.",
    socials: [
      { label: "Instagram", url: "#" },
      { label: "TikTok", url: "#" }
    ]
  };

  const PRODUCTS = [
    {
      name: "Ajazz AK820 Monochrome V2 75% Mechanical Keyboard",
      image: "https://naufaljdn.github.io/affiliate/produk1.jpg",
      category: "gaming",
      rating: 4.9,
      reviews: 4200,
      price: "Rp 360.000",
      review: "Dengan 5-Layer Dampening System, typing feel-nya senyap, empuk, dan stabil. Ideal buat gaming malam hari maupun kerja fokus. Build quality solid banget buat harga segini.",
      platform: "shopee",
      buyUrl: "https://id.shp.ee/ohtsDuNr"
    },
    {
      name: "Fantech THOR X9 Gaming Mouse Macro",
      image: "https://naufaljdn.github.io/affiliate/produk2.jpg",
      category: "gaming",

      review: "Ruang penyimpanannya luas dan tertata, rain cover bawaan beneran nyelamatin barang pas hujan deras waktu naik gunung.",

      buyUrl: "https://shopee.co.id/"
    },
    {
      name: "Sepatu Trekking Anti Slip",
      image: "https://placehold.co/500x500/1B1E27/9497A3?text=Foto+Produk",
      category: "hiking",
      rating: 4.7,
      reviews: 833,
      price: "Rp 385.000",
      review: "Grip-nya kuat banget di jalur licin dan berbatu, sol empuk jadi kaki gak cepat capek meski dipakai trekking seharian.",
      platform: "shopee",
      buyUrl: "https://shopee.co.id/"
    }
  ];

  /* ============================================================
     Kategori yang ditampilkan sebagai tombol filter
     ============================================================ */
  const CATEGORIES = [
    { key: "all",         label: "All",              icon: "🗂️" },
    { key: "gaming",      label: "Gaming Essential",  icon: "🎮" },
    { key: "electronic",  label: "Electronic",        icon: "💻" },
    { key: "accessories", label: "Accessories",       icon: "🎧" },
    { key: "sport",       label: "Sport",             icon: "⚽" },
    { key: "hiking",      label: "Hiking",            icon: "🥾" }
  ];

  const CATEGORY_LABEL = Object.fromEntries(CATEGORIES.map(c => [c.key, c.label]));
  const CATEGORY_ICON = Object.fromEntries(CATEGORIES.map(c => [c.key, c.icon]));

  let activeCategory = "all";
  let searchQuery = "";

  /* ---------- render kategori chips ---------- */
  const categoryBar = document.getElementById("categoryBar");
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "chip" + (cat.key === activeCategory ? " active" : "");
    btn.dataset.key = cat.key;
    btn.innerHTML = `<span>${cat.icon}</span><span>${cat.label}</span>`;
    btn.addEventListener("click", () => {
      activeCategory = cat.key;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      render();
    });
    categoryBar.appendChild(btn);
  });

  /* ---------- render section "Tentang Gua" ---------- */
  document.getElementById("aboutSection").innerHTML = `
    <div class="about-inner">
      <div class="about-avatar">${ABOUT_ME.avatarImage ? `<img src="${ABOUT_ME.avatarImage}" alt="${ABOUT_ME.name}">` : ABOUT_ME.initials}</div>
      <div class="about-text">
        <div class="about-name">${ABOUT_ME.name}</div>
        <div class="about-tagline">${ABOUT_ME.tagline}</div>
        <div class="about-bio">${ABOUT_ME.bio}</div>
        <div class="about-socials">
          ${ABOUT_ME.socials.map(s => `<a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.label}</a>`).join("")}
        </div>
      </div>
    </div>
  `;

  /* ---------- helper: format jumlah ulasan jadi singkatan RB / JT ---------- */
  function formatReviewCount(n){
    if (typeof n !== "number" || isNaN(n)) return n;
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "JT";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "RB";
    return n.toLocaleString("id-ID");
  }

  /* ---------- render grid produk ---------- */
  const grid = document.getElementById("productGrid");
  const emptyState = document.getElementById("emptyState");
  const resultCount = document.getElementById("resultCount");
  const sectionTitle = document.getElementById("sectionTitle");

  /* ---------- skeleton loading ---------- */
  function renderSkeletons(count){
    grid.innerHTML = "";
    emptyState.style.display = "none";
    resultCount.textContent = "";
    for (let i = 0; i < count; i++){
      const sk = document.createElement("div");
      sk.className = "skeleton-card";
      sk.innerHTML = `
        <div class="skeleton-img skeleton-shimmer"></div>
        <div class="skeleton-body">
          <div class="skeleton-line skeleton-shimmer w-40" style="height:18px;border-radius:999px;width:90px;"></div>
          <div class="skeleton-line skeleton-shimmer w-100" style="height:16px;"></div>
          <div class="skeleton-line skeleton-shimmer w-70"></div>
          <div class="skeleton-line skeleton-shimmer w-40"></div>
          <div class="skeleton-btn skeleton-shimmer"></div>
        </div>
      `;
      grid.appendChild(sk);
    }
  }

  /* ---------- detail modal ---------- */
  const modalOverlay = document.getElementById("modalOverlay");
  let lastFocusedEl = null;

  function openModal(p){
    lastFocusedEl = document.activeElement;
    document.getElementById("modalImg").src = p.image;
    document.getElementById("modalImg").alt = p.name;
    document.getElementById("modalCat").textContent = `${CATEGORY_ICON[p.category] || ""} ${CATEGORY_LABEL[p.category] || p.category}`;
    document.getElementById("modalName").textContent = p.name;
    document.getElementById("modalRating").innerHTML = `
      <span class="star-icon">★</span>
      <b>${p.rating.toFixed(1)}</b>
      <span class="muted">(${formatReviewCount(p.reviews)} reviews)</span>
    `;
    document.getElementById("modalPrice").textContent = p.price || "";
    document.getElementById("modalPrice").style.display = p.price ? "block" : "none";
    document.getElementById("modalReview").textContent = p.review ? `"${p.review}"` : "";
    document.getElementById("modalReview").style.display = p.review ? "block" : "none";

    let buyHtml;
    if (p.platform === "shopee" && p.buyUrl){
      buyHtml = `<a class="buy-btn shopee" href="${p.buyUrl}" target="_blank" rel="noopener noreferrer">Beli di Shopee</a>`;
    } else if (p.platform === "tokopedia" && p.buyUrl){
      buyHtml = `<a class="buy-btn tokopedia" href="${p.buyUrl}" target="_blank" rel="noopener noreferrer">Beli di Tokopedia</a>`;
    } else {
      buyHtml = `<span class="buy-btn disabled">Link belum tersedia</span>`;
    }
    document.getElementById("modalBuy").innerHTML = buyHtml;

    modalOverlay.classList.add("open");
    document.body.style.overflow = "hidden";
    document.getElementById("modalClose").focus();
  }

  function closeModal(){
    modalOverlay.classList.remove("open");
    document.body.style.overflow = "";
    if (lastFocusedEl) lastFocusedEl.focus();
  }

  document.getElementById("modalClose").addEventListener("click", closeModal);
  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && modalOverlay.classList.contains("open")) closeModal();
  });

  function render(){
    const q = searchQuery.trim().toLowerCase();

    const filtered = PRODUCTS.filter(p => {
      const matchCategory = activeCategory === "all" || p.category === activeCategory;
      const matchSearch = p.name.toLowerCase().includes(q);
      return matchCategory && matchSearch;
    });

    sectionTitle.textContent = activeCategory === "all" ? "Semua Produk" : CATEGORY_LABEL[activeCategory];
    resultCount.textContent = `${filtered.length} produk`;

    grid.innerHTML = "";

    if (filtered.length === 0){
      emptyState.style.display = "block";
      return;
    }
    emptyState.style.display = "none";

    filtered.forEach(p => {
      const card = document.createElement("div");
      card.className = "card";
      card.style.cursor = "pointer";

      let buyButtonHtml;
      if (p.platform === "shopee" && p.buyUrl){
        buyButtonHtml = `<a class="buy-btn shopee" href="${p.buyUrl}" target="_blank" rel="noopener noreferrer">Beli di Shopee</a>`;
      } else if (p.platform === "tokopedia" && p.buyUrl){
        buyButtonHtml = `<a class="buy-btn tokopedia" href="${p.buyUrl}" target="_blank" rel="noopener noreferrer">Beli di Tokopedia</a>`;
      } else {
        buyButtonHtml = `<span class="buy-btn disabled">Link belum tersedia</span>`;
      }

      card.innerHTML = `
        <div class="card-img">
          <img src="${p.image}" alt="${p.name}" loading="lazy">
        </div>
        <div class="card-body">
          <span class="card-cat">${CATEGORY_ICON[p.category] || ""} ${CATEGORY_LABEL[p.category] || p.category}</span>
          <div class="card-name">${p.name}</div>
          <div class="rating-row">
            <span class="star-icon">★</span>
            <b>${p.rating.toFixed(1)}</b>
            <span class="muted">(${formatReviewCount(p.reviews)} reviews)</span>
          </div>
          ${p.price ? `<div class="card-price">${p.price}</div>` : ""}
          ${p.review ? `<div class="card-quote">"${p.review}"</div>` : ""}
          ${buyButtonHtml}
        </div>
      `;

      // fade-in gambar begitu selesai loading
      const imgEl = card.querySelector(".card-img img");
      imgEl.addEventListener("load", () => imgEl.classList.add("loaded"));
      if (imgEl.complete) imgEl.classList.add("loaded");

      // klik card (selain tombol beli) buka detail modal
      card.addEventListener("click", () => openModal(p));
      const buyEl = card.querySelector(".buy-btn");
      if (buyEl) buyEl.addEventListener("click", (e) => e.stopPropagation());

      grid.appendChild(card);
    });
  }

  document.getElementById("searchInput").addEventListener("input", (e) => {
    searchQuery = e.target.value;
    render();
  });

  /* ---------- dark / light mode ---------- */
  const themeToggle = document.getElementById("themeToggle");
  const body = document.body;

  const prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  body.setAttribute("data-theme", prefersLight ? "light" : "dark");

  themeToggle.addEventListener("click", () => {
    const current = body.getAttribute("data-theme");
    body.setAttribute("data-theme", current === "dark" ? "light" : "dark");
  });

  renderSkeletons(6);
  setTimeout(render, 600);
</script>
</body>
